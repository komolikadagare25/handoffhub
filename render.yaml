services:
  - type: web
    name: handoffhub
    runtime: node
    plan: free
    # Node 22+ is required (built-in node:sqlite)
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set this in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: NODE_VERSION
        value: "22"
      - key: SEED
        value: "true"
# Note: the free plan has an ephemeral disk, so data resets on redeploy/restart.
# Fine for evaluation (seed data reloads). For durability add a persistent disk and set DB_PATH/LOG_DIR to it.